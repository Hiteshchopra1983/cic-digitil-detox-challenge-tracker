# Free-tier API deploy: https://dashboard.render.com → New → Blueprint
# After first deploy, set DATABASE_URL (Neon) and FRONTEND_URL (Vercel) in the dashboard.

services:
  - type: web
    name: cic-dd2-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
